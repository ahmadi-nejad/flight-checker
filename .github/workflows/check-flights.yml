name: Check Flights

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run flight checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLIGHT_CONFIG: ${{ secrets.FLIGHT_CONFIG }}
          IRAN_PROXY_SERVER: ${{ secrets.IRAN_PROXY_SERVER }}
          IRAN_PROXY_USERNAME: ${{ secrets.IRAN_PROXY_USERNAME }}
          IRAN_PROXY_PASSWORD: ${{ secrets.IRAN_PROXY_PASSWORD }}
        run: python check_flights.py

      - name: Commit updated state
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
